<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05060c" />
<title>霓虹弹珠台 · NEON PINBALL</title>
<link rel="stylesheet" href="css/main.css" />
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="stats">
      <div class="stat"><span class="label">分数</span><span class="value" id="uiScore">0</span></div>
      <div class="stat"><span class="label">最高分</span><span class="value" id="uiBest">0</span></div>
      <div class="stat"><span class="label">剩余球</span><span class="value" id="uiBalls">3</span></div>
    </div>
    <div class="mini">
      <button id="btnTable" type="button">菜单</button>
      <button id="btnPause" type="button">暂停</button>
      <button id="btnRestart" type="button">重开</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="game"></canvas>

    <div id="overlay" class="hidden">
      <div class="panel">
        <h2 id="ovTitle">霓虹弹珠台</h2>
        <div class="big" id="ovBig" style="display:none"></div>
        <p id="ovText"></p>
        <div id="ovPicker" class="picker"></div>
        <div class="ov-actions">
          <button id="ovBtn" type="button">开始游戏</button>
          <button id="ovAlt" class="ghost" type="button" style="display:none">换个台面</button>
        </div>
      </div>
    </div>
  </main>

  <footer id="controls">
    <button id="btnLeft" class="pad" type="button"><span class="arrow">◀</span><span class="cap">左挡板</span></button>
    <button id="btnLaunch" type="button"><span class="cap">按住蓄力 · 松开发射</span></button>
    <button id="btnRight" class="pad" type="button"><span class="arrow">▶</span><span class="cap">右挡板</span></button>
  </footer>
</div>

<!-- 模块按依赖顺序加载：配置 → 工具 → 音效 → 台面 → 母题 → 挡板 → 特效 → 材质 → 物理 → 渲染 → 状态机 → 启动 -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/audio.js"></script>
<script src="js/tables.js"></script>
<script src="js/motifs.js"></script>
<script src="js/flipper.js"></script>
<script src="js/effects.js"></script>
<script src="js/materials.js"></script>
<script src="js/physics.js"></script>
<script src="js/renderer.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
